# Artemis scout worker configuration.
# All scouts default to disabled until their D2+ implementation is ready.
# Set enabled: true and restart the worker process to activate a scout.
#
# Env var overrides (take precedence over this file):
#   ARTEMIS_API_URL        — Python app base URL (default: http://localhost:8000)
#   ARTEMIS_TOKEN          — bearer token for /api/scouts/runs
#   ARTEMIS_SCOUT_DRY_RUN  — set to "1" to force dry_run on all scouts

api_url: "http://localhost:8000"
dry_run: false

scouts:
  # D2 — Legislative Scout (LegiScan API). Requires LEGISCAN_API_KEY.
  legislative_scout:
    enabled: false
    interval_minutes: 1440  # daily; off-session: set to 10080 (weekly)

  # D3 — Federal Funding Scout (Federal Register + Grants.gov + ED.gov RSS).
  # Grants.gov optional key: GRANTS_GOV_API_KEY (higher rate limit with key).
  federal_funding_scout:
    enabled: false
    interval_minutes: 1440  # daily

  # D4 — Starbridge Researcher. API shape TBD; bench-test status.
  # Requires STARBRIDGE_API_KEY. All API calls tagged bench_test_period=true.
  starbridge_researcher:
    enabled: false
    interval_minutes: 240  # 4h poll

  # D5 — State DoE Scout (RSS + scraping + state-board PDFs).
  # Broadened 2026-07-10: STATE_DOE_SOURCES now covers 20 states (was 7) —
  # see artemis/scouts/state_doe/sources.py. No extra env vars required;
  # scraping is unauthenticated.
  state_doe_scout:
    enabled: false
    interval_minutes: 1440  # daily

  # D6 — Board Minutes Scout (BoardDocs + Granicus + per-district PDFs).
  # Watch list is hardcoded for V1; migrates to districts table in a later phase.
  board_minutes_scout:
    enabled: false
    interval_minutes: 10080  # weekly (7 days)

  # D7 — Procurement Scout (9 statewide portals, twice-daily cadence).
  procurement_scout:
    enabled: false
    interval_minutes: 720  # 12h (twice daily)

  # D8 — Leadership Transition Scout (cross-source aggregator: board minutes + state DoE + news API).
  # NEWS_API_KEY optional — falls back to board_minutes + state_doe only when absent.
  # No districts table yet — V1 watch list is hardcoded in the scout.
  leadership_transition_scout:
    enabled: false
    interval_minutes: 10080  # weekly base; transitions are rare

  # D9 — Regional News Scout (News API + board minutes + state DoE, multi-source).
  # Requires NEWS_API_KEY for news API access (graceful no-op when absent).
  # Broadened 2026-07-10: query/relevance keywords now cover screen-time and
  # AI-in-schools terms (not just literacy) and the Screen-Time Watch fan-out
  # passes a major-ed-policy-outlet domain filter — see
  # artemis/scouts/regional_news/client.py (TOPIC_KEYWORDS, NEWS_OUTLET_DOMAINS).
  regional_news_scout:
    enabled: false
    interval_minutes: 1440  # daily

  # D10 — LinkedIn Observer (Mode B only — leader post monitoring).
  # Requires LINKEDIN_SCRAPER_API_KEY (third-party scraper service).
  # Mode A (follower digest) is disabled in v1 — no Contact team consumer yet.
  # LEGAL: confirm scraper service ToS compliance before enabling.
  linkedin_observer:
    enabled: false
    interval_minutes: 60  # hourly during business hours (scheduler filters off-hours)

  # D6b — Board Peer-Validation Scout (BoardDocs item bodies + LLM mention/
  # sentiment classifier). Non-customer districts discussing Amira/screentime/
  # AI-in-schools. Customer exclusion list is injected (Salesforce later —
  # StaticCustomerExclusions() defaults to an EMPTY set until wired, so a
  # customer district could surface until that lands; downstream review
  # catches these). Enabled 2026-07-10 with a 13-district REAL starter seed
  # list (BoardDocs-verified) — see board_minutes/peer_scout.py. Also wired
  # into the Screen-Time Watch national fan-out (artemis/screentime/scout_fanout.py).
  board_peer_validation_scout:
    # HELD DISABLED until the Salesforce customer list powers the non-customer
    # exclusion (Neil, pending). Enabling now would flag CUSTOMER districts as
    # "peer validation" — backwards. Wiring + seed list are ready; flip to true
    # once the exclusion source lands.
    enabled: false
    interval_minutes: 10080  # weekly
