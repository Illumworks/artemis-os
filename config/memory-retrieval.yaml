# Memory retrieval fusion weights and tuning knobs.
# Weights must sum to 1.0. Matches the Node reference memory-retrieval.json.

weights:
  fts: 0.30        # tsvector BM25 (ts_rank)
  semantic: 0.40   # pgvector cosine similarity
  recency: 0.15    # exponential decay from created_at
  score: 0.15      # stored score field (decayed by maintenance in B3)

# Candidate pool per modality before fusion.
# Raised from 50→150 in M1c: lifts genuine recall miss #715 into the pool.
top_k: 150

# Series-aware collapse: when multiple snapshots of the same time-series appear
# in the scored pool, keep only the LATEST one and let distinct results fill the
# freed slot.  Set to false to restore the pre-M1c byte-identical behaviour.
series_collapse: true

# Recency half-life in days — score halves after this many days
recency_decay_days: 30.0

# Sub-weights for the stored score channel.
# Each component is multiplied by weights.score in the final fusion sum.
score_features:
  relevance: 0.40   # decayed stored obs.score
  hits: 0.15        # normalized hit_count (min(1, count/10))
  quality: 0.35     # source_quality
  confirmed: 0.10   # 1.0 if user_confirmed
