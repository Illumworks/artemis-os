<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F2ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artemis :: offline</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:            #F5F2ED;
  --bg-secondary:  #FBF8F2;
  --bg-deep:       #EDE7DE;
  --bg-elevated:   #FFFDF8;
  --border:        rgba(30, 26, 21, 0.08);
  --border-subtle: rgba(30, 26, 21, 0.05);
  --border-accent: rgba(212, 137, 26, 0.12);
  --text:          #1E1A15;
  --text-sec:      #6B5D4F;
  --text-dim:      #9C8878;
  --accent:        #D4891A;
  --accent-ink:    #8A5A12;
  --accent-dim:    rgba(212, 137, 26, 0.08);
  --accent-glow:   rgba(212, 137, 26, 0.18);
  --success:       #7A9E8E;
  --warning:       #D4891A;
  --error:         #C94A1F;
  --font-display:  "Inter","Segoe UI",sans-serif;
  --font-sans:     "Inter","Segoe UI",sans-serif;
  --font-mono:     "JetBrains Mono","SF Mono","Fira Code","Cascadia Code","Consolas",monospace;
}

html[data-theme="light"] .status-bar::before{ opacity:0; }

html{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(212, 137, 26, 0.10), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(94, 131, 114, 0.08), transparent 28%),
    linear-gradient(180deg, rgba(255,255,255,0.58), transparent 24%);
}

/* ── Main ── */
.main-area{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 24px 80px;
  gap:20px;
  opacity:0;
  animation:fadeIn .5s ease .1s forwards;
}
@keyframes fadeIn{to{opacity:1}}

.artemis-brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  margin-bottom:8px;
}
.artemis-offline-mark{
  width:96px;
  height:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 8px 24px rgba(212, 137, 26,.08)) grayscale(.2);
  transition:filter .3s;
  cursor:pointer;
}
.artemis-offline-mark:hover{
  filter:drop-shadow(0 8px 32px rgba(212, 137, 26,.18)) grayscale(0);
}
.artemis-wordmark{
  font-family:var(--font-display);
  font-weight:800;
  font-size:28px;
  letter-spacing:0.14em;
  color:var(--accent-ink);
  line-height:1;
}

.artemis-offline-text{
  color:var(--text-sec);
  font-size:14px;
  font-family:var(--font-display);
  text-align:center;
  letter-spacing:.02em;
  font-weight:500;
}
.artemis-offline-hint{
  color:var(--text-dim);
  font-size:12px;
  font-family:var(--font-sans);
  text-align:center;
  line-height:1.6;
  max-width:360px;
}

/* Retry button */
.retry-wrap{
  margin-top:12px;
  opacity:0;
  animation:fadeIn .4s ease .4s forwards;
}
.retry-btn{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  color:var(--accent-ink);
  font-family:var(--font-display);
  font-size:13px;
  font-weight:500;
  padding:10px 22px;
  border-radius:8px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
  box-shadow:0 1px 2px rgba(30,26,21,0.03);
}
.retry-btn:hover{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
  color:var(--accent-ink);
}
.retry-btn:active{
  transform:scale(.98);
}
.retry-btn svg{
  width:14px;height:14px;
  animation:spin 2s linear infinite paused;
}
.retry-btn:hover svg{
  animation-play-state:running;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ── Status bar ── */
.status-bar{
  height:24px;
  background:var(--bg-deep);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 12px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-dim);
  flex-shrink:0;
  user-select:none;
  position:relative;
}
.status-bar::before{
  content:"";
  position:absolute;
  top:-1px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-glow), transparent);
  opacity:.3;
}
.sb-left,.sb-right{
  display:flex;align-items:center;gap:0;
}
.sb-left{flex:1;justify-content:flex-start;}
.sb-right{flex:1;justify-content:flex-end;}
.sb-item{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 8px;height:24px;white-space:nowrap;
}
.sb-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--error);flex-shrink:0;
}
.sb-dot.blink{
  animation:blink 1.5s infinite;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}
.sb-sep{
  width:1px;height:12px;
  background:var(--border);flex-shrink:0;
}

/* Responsive */
@media(max-width:640px){
  .artemis-offline-mark{width:72px}
  .artemis-wordmark{font-size:22px;letter-spacing:0.12em;}
}
</style>
<script>
const t = localStorage.getItem('artemis-theme');
if (t) document.documentElement.setAttribute('data-theme', t);
</script>
</head>
<body>

<main class="main-area">
  <div class="artemis-brand">
    <img src="/icons/artemis-mark.png" alt="Artemis" class="artemis-offline-mark" id="artemis-offline-mark">
    <div class="artemis-wordmark">ARTEMIS</div>
  </div>
  <div class="artemis-offline-text">No connection</div>
  <div class="artemis-offline-hint">
    Artemis needs a network connection to reach Claude Code.<br>
    We'll keep retrying in the background.
  </div>
  <div class="retry-wrap">
    <button class="retry-btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Retry connection
    </button>
  </div>
</main>

<div class="status-bar">
  <div class="sb-left">
    <div class="sb-item">
      <div class="sb-dot blink"></div>
      disconnected
    </div>
    <div class="sb-sep"></div>
    <div class="sb-item">ARTEMIS &middot; waiting for network</div>
  </div>
  <div class="sb-right">
    <div class="sb-item">offline</div>
  </div>
</div>

<script>
// Auto-retry every 10 seconds
let retryTimer;
function startAutoRetry() {
  retryTimer = setInterval(() => {
    fetch('/api/version', { cache: 'no-store' })
      .then(r => { if (r.ok) location.reload(); })
      .catch(() => {});
  }, 10000);
}
startAutoRetry();

let clicks = 0;
document.getElementById('artemis-offline-mark').addEventListener('click', () => {
  clicks++;
  if (clicks >= 5) {
    clicks = 0;
    const mark = document.getElementById('artemis-offline-mark');
    mark.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
    mark.style.transform = 'scale(1.2) rotate(-10deg)';
    setTimeout(() => { mark.style.transform = ''; }, 500);
  }
});
</script>
</body>
</html>
