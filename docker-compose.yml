services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: artemis-os-postgres
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis_os
    ports:
      - "5433:5432"
    volumes:
      - artemis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  artemis_pg_data:
